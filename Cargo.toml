[package]
name = "slint-rust-template"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.10"
slint = { version = "1.19.1", features = ["live-preview"] }

[build-dependencies]
slint-build = "1.19.1"

[profile.release]
codegen-units = 1
lto = true
